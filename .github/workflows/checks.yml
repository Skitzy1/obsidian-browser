name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install source-check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare Servo on Linux
        if: runner.os == 'Linux'
        run: sh scripts/prepare.sh
      - name: Prepare Servo on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare.ps1
      - name: Check source and bundled pages
        run: python scripts/check-source.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test local storage
        run: cargo +1.99.1 test --locked --manifest-path checks/native/Cargo.toml
